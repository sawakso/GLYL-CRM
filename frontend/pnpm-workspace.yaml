packages:
  # all packages in direct subdirs of packages/
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  vue-echarts: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild
  - unrs-resolver
  - vue-demi
  - vue-echarts
