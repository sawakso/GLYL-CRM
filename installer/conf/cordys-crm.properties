logger.sql.level=info
management.endpoints.enabled-by-default=false
springdoc.api-docs.groups.enabled=true
spring.freemarker.check-template-location=false
spring.groovy.template.check-template-location=false

# 纷享销客风格 CRM 独立运行配置。
# MySQL 与 Redis 均使用独立命名空间，禁止与原 Cordys CRM 环境共用数据。
mysql.embedded.enabled=true
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fxiaoke_crm_5174?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false&sessionVariables=sql_mode=%27STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION%27
spring.datasource.username=fxiaoke_crm_5174
spring.datasource.password=${MYSQL_PASSWORD}
spring.session.timeout=30d
spring.flyway.table=fxiaoke_crm_5174_version
spring.flyway.baseline-on-migrate=false
quartz.scheduler-name=fxiaoke-crm-5174-quartz


redis.embedded.enabled=true
spring.data.redis.host=127.0.0.1
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.port=6379
spring.data.redis.database=0
spring.session.redis.repository-type=indexed
spring.session.redis.namespace=fxiaoke-crm-5174:session
spring.cache.redis.key-prefix=fxiaoke-crm-5174:cache:
spring.cache.redis.use-key-prefix=true

# MCP Server 配置
mcp.embedded.enabled=true
cordys.crm.url=http://127.0.0.1:8081
spring.mvc.async.request-timeout=60000
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.name=fxiaoke-crm-5174-mcp-server
spring.ai.mcp.server.version=1.0.0

# Enable whitelist functionality, if not enabled, access will not be restricted.
allowed.ip.ranges.enabled=false
# Enable whitelist functionality, if not enabled, access will not be restricted.
allowed.ip.ranges=

# List of URLs that require XSS filtering, supports Ant-style path matching, e.g., /api/**. If no URLs need to be filtered, it can be left empty.
xss.protection.url.list=/account/follow/**,/announcement/add

# Secret key for Cordys applications
cordys.secret.key=${CORDYS_SECRET_KEY}

# Dangerous pattern configuration for SQL injection detection. Default configuration includes common SQL injection attack patterns and can be adjusted based on actual needs.
# sql.injection.dangerous-pattern=--[^\\n]*|#|/\\*!?|\\*/|'|\"|\\\\|;|\\b(?:xp_\\w+|sp_\\w+|dbms_\\w+|utl_\\w+)\\b|\\b(?:select|insert|update|delete|drop|alter|truncate|exec|execute|merge|replace|load_file|outfile|dumpfile)\\b|\\b(?:union\\s+(?:all\\s+)?select|information_schema|table_name|column_name)\\b|\\b(?:sleep|benchmark|pg_sleep|dbms_lock\\.sleep|dbms_pipe\\.receive_message|waitfor\\s+delay)\\b|\\b(?:and|or)\\b\\s*(?:'|[0-9]|\\()
